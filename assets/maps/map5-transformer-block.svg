<svg viewBox="0 0 580 740" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;font-family:Inter,system-ui,sans-serif"><defs><marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#374151"/></marker></defs><rect x="8.0" y="60" width="328" height="552" rx="10" fill="#F5F3FF" stroke="#4338CA" stroke-width="1.4" stroke-dasharray="6 4"/><text x="16.0" y="76" font-size="9.6" font-weight="700" fill="#4338CA">ONE BLOCK · ×12 in GPT-2 · ×32 in Llama-3-8B</text><text x="172" y="22" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">token IDs → embedding + position</text><text x="336.0" y="22" font-size="10.4" font-family="DejaVu Sans Mono, monospace" fill="#111827">[B, T] → [B, T, 768]</text><path d="M172 28 L172 84" stroke="#374151" stroke-width="1.5" marker-end="url(#ab)"/><rect x="20.0" y="86" width="304" height="30" rx="6" fill="#fff" stroke="#0E7490" stroke-width="1.6"/><text x="172" y="103.5" font-size="12.5" font-weight="700" fill="#0E7490" text-anchor="middle">LayerNorm (pre-norm)</text><text x="336.0" y="104.5" font-size="10.4" font-family="DejaVu Sans Mono, monospace" fill="#111827">[B, T, 768]</text><path d="M172 116 L172 130" stroke="#374151" stroke-width="1.5" marker-end="url(#ab)"/><rect x="20.0" y="132" width="304" height="128" rx="6" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.6"/><text x="172" y="149.5" font-size="12.5" font-weight="700" fill="#4338CA" text-anchor="middle">Multi-head causal self-attention</text><text x="172" y="165" font-size="10.2" fill="#374151" text-anchor="middle">Q = xW_Q   K = xW_K   V = xW_V    each 768 → 768</text><text x="172" y="178" font-size="10.2" fill="#374151" text-anchor="middle">split into 12 heads of 64:  [B, 12, T, 64]</text><text x="172" y="191" font-size="10.2" fill="#374151" text-anchor="middle">scores = QKᵀ / √64  → [B, 12, T, T]</text><text x="172" y="204" font-size="10.2" fill="#374151" text-anchor="middle">causal mask (no peeking ahead) → softmax</text><text x="172" y="217" font-size="10.2" fill="#374151" text-anchor="middle">× V → [B, 12, T, 64] → concat → W_O → [B, T, 768]</text><text x="336.0" y="182" font-size="10.4" font-family="DejaVu Sans Mono, monospace" fill="#111827">4 × 768² ≈ 2.4M params</text><text x="336.0" y="198" font-size="10" fill="#6B7280">mixes information</text><text x="336.0" y="211" font-size="10" fill="#6B7280">BETWEEN tokens</text><path d="M172 260 L172 274" stroke="#374151" stroke-width="1.5" marker-end="url(#ab)"/><rect x="20.0" y="276" width="304" height="30" rx="6" fill="#fff" stroke="#374151" stroke-width="1.6"/><text x="172" y="293.5" font-size="12.5" font-weight="700" fill="#374151" text-anchor="middle">+ residual (add the block input back)</text><text x="336.0" y="294.5" font-size="10.4" font-family="DejaVu Sans Mono, monospace" fill="#111827">[B, T, 768]</text><path d="M172 306 L172 322" stroke="#374151" stroke-width="1.5" marker-end="url(#ab)"/><rect x="20.0" y="324" width="304" height="30" rx="6" fill="#fff" stroke="#0E7490" stroke-width="1.6"/><text x="172" y="341.5" font-size="12.5" font-weight="700" fill="#0E7490" text-anchor="middle">LayerNorm</text><text x="336.0" y="342.5" font-size="10.4" font-family="DejaVu Sans Mono, monospace" fill="#111827">[B, T, 768]</text><path d="M172 354 L172 370" stroke="#374151" stroke-width="1.5" marker-end="url(#ab)"/><rect x="20.0" y="372" width="304" height="80" rx="6" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.6"/><text x="172" y="389.5" font-size="12.5" font-weight="700" fill="#4338CA" text-anchor="middle">Feed-forward network (MLP)</text><text x="172" y="405" font-size="10.2" fill="#374151" text-anchor="middle">768 → 3072  (GELU)  → 768</text><text x="172" y="418" font-size="10.2" fill="#374151" text-anchor="middle">same small network applied to every token separately</text><text x="172" y="431" font-size="10.2" fill="#374151" text-anchor="middle">Llama: SwiGLU, 4096 → 14336 → 4096</text><text x="336.0" y="406" font-size="10.4" font-family="DejaVu Sans Mono, monospace" fill="#111827">2 × 768 × 3072 ≈ 4.7M</text><text x="336.0" y="422" font-size="10" fill="#6B7280">processes each token;</text><text x="336.0" y="435" font-size="10" fill="#6B7280">where facts are stored</text><path d="M172 452 L172 468" stroke="#374151" stroke-width="1.5" marker-end="url(#ab)"/><rect x="20.0" y="470" width="304" height="30" rx="6" fill="#fff" stroke="#374151" stroke-width="1.6"/><text x="172" y="487.5" font-size="12.5" font-weight="700" fill="#374151" text-anchor="middle">+ residual</text><text x="336.0" y="488.5" font-size="10.4" font-family="DejaVu Sans Mono, monospace" fill="#111827">[B, T, 768]</text><path d="M172 500 L172 520" stroke="#374151" stroke-width="1.5" marker-end="url(#ab)"/><text x="172" y="534" font-size="9.6" fill="#6B7280" text-anchor="middle">… repeat for every block, then final LayerNorm …</text><path d="M172 540 L172 558" stroke="#374151" stroke-width="1.5" marker-end="url(#ab)"/><rect x="20.0" y="560" width="304" height="44" rx="6" fill="#fff" stroke="#1D4ED8" stroke-width="1.6"/><text x="172" y="577.5" font-size="12.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">LM head (unembedding)</text><text x="172" y="593" font-size="10.2" fill="#374151" text-anchor="middle">768 → 50,257 logits, one per vocabulary token</text><text x="172" y="606" font-size="10.2" fill="#374151" text-anchor="middle">GPT-2 ties this to the embedding matrix</text><text x="336.0" y="585.5" font-size="10.4" font-family="DejaVu Sans Mono, monospace" fill="#111827">[B, T, 50257]</text><path d="M172 604 L172 620" stroke="#374151" stroke-width="1.5" marker-end="url(#ab)"/><text x="172" y="635" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">softmax → next-token probabilities</text><text x="172" y="650" font-size="9.2" fill="#6B7280" text-anchor="middle">training: cross-entropy vs the real next token · inference: sample one</text></svg>
