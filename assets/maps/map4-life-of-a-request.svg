<svg viewBox="0 0 760 905" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;font-family:Inter,system-ui,sans-serif"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#374151"/></marker><marker id="arl" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#9CA3AF"/></marker></defs><rect x="70" y="18" width="380" height="86" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="1.8"/><circle cx="88" cy="38" r="11" fill="#15803D"/><text x="88" y="42.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="106" y="42" font-size="12" font-weight="700" fill="#15803D">Your app assembles the prompt</text><text x="82" y="64" font-size="9.4" fill="#1F2937">system prompt + conversation history + retrieved docs (RAG)</text><text x="82" y="78" font-size="9.4" fill="#1F2937">+ tool definitions + the new user message</text><text x="468" y="40" font-size="9.6" font-weight="700" fill="#15803D">Stage 7 · context engineering</text><text x="468" y="56" font-size="9" fill="#374151">Everything the model will know about this request is in</text><text x="468" y="69" font-size="9" fill="#374151">this text. Nothing else exists for it.</text><path d="M260.0 104 L260.0 124" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/><rect x="70" y="126" width="380" height="86" rx="8" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.8"/><circle cx="88" cy="146" r="11" fill="#0F766E"/><text x="88" y="150.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="106" y="150" font-size="12" font-weight="700" fill="#0F766E">Tokenizer: text → token IDs</text><text x="82" y="172" font-size="9.4" fill="#1F2937">&quot;Katowice&quot; → sub-word pieces → integer IDs  ·  Polish ≈ 2× the tokens of English</text><text x="82" y="186" font-size="9.4" fill="#1F2937">prompt + max output must fit the context window</text><text x="468" y="148" font-size="9.6" font-weight="700" fill="#0F766E">Stage 1 · input tokens</text><text x="468" y="164" font-size="9" fill="#374151">Billed as input tokens. The context-window</text><text x="468" y="177" font-size="9" fill="#374151">check happens here.</text><path d="M260.0 212 L260.0 232" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/><rect x="70" y="234" width="380" height="86" rx="8" fill="#E0E7FF" stroke="#4338CA" stroke-width="1.8"/><circle cx="88" cy="254" r="11" fill="#4338CA"/><text x="88" y="258.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="106" y="258" font-size="12" font-weight="700" fill="#4338CA">Embedding lookup (+ position)</text><text x="82" y="280" font-size="9.4" fill="#1F2937">token IDs → vectors, shape [T × d_model]</text><text x="82" y="294" font-size="9.4" fill="#1F2937">GPT-2 adds learned positions here; RoPE models add it inside attention</text><text x="468" y="256" font-size="9.6" font-weight="700" fill="#4338CA">Stage 2</text><text x="468" y="272" font-size="9" fill="#374151">The same embedding table the model learned</text><text x="468" y="285" font-size="9" fill="#374151">in pre-training.</text><path d="M260.0 320 L260.0 340" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/><rect x="70" y="342" width="380" height="86" rx="8" fill="#E0E7FF" stroke="#4338CA" stroke-width="1.8"/><circle cx="88" cy="362" r="11" fill="#4338CA"/><text x="88" y="366.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="106" y="366" font-size="12" font-weight="700" fill="#4338CA">N × Transformer blocks: PREFILL</text><text x="82" y="388" font-size="9.4" fill="#1F2937">all prompt tokens processed in parallel</text><text x="82" y="402" font-size="9.4" fill="#1F2937">attention reads the whole prompt; keys and values are stored in the KV cache</text><text x="468" y="364" font-size="9.6" font-weight="700" fill="#4338CA">Compute-bound · decides TTFT</text><text x="468" y="380" font-size="9" fill="#374151">Prompt caching reuses this work for a repeated</text><text x="468" y="393" font-size="9" fill="#374151">prefix (long system prompt, same documents).</text><path d="M260.0 428 L260.0 448" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/><rect x="70" y="450" width="380" height="86" rx="8" fill="#E0E7FF" stroke="#4338CA" stroke-width="1.8"/><circle cx="88" cy="470" r="11" fill="#4338CA"/><text x="88" y="474.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="106" y="474" font-size="12" font-weight="700" fill="#4338CA">LM head → logits → softmax</text><text x="82" y="496" font-size="9.4" fill="#1F2937">one score for every token in the vocabulary (≈ 50k–200k)</text><text x="82" y="510" font-size="9.4" fill="#1F2937">→ probabilities that sum to 1</text><text x="468" y="472" font-size="9.6" font-weight="700" fill="#4338CA">Stage 2 / 6</text><text x="468" y="488" font-size="9" fill="#374151">Logprobs come from here. A reasoning model&#x27;s</text><text x="468" y="501" font-size="9" fill="#374151">“thinking” is ordinary tokens produced the same way.</text><path d="M260.0 536 L260.0 556" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/><rect x="70" y="558" width="380" height="86" rx="8" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.8"/><circle cx="88" cy="578" r="11" fill="#C2410C"/><text x="88" y="582.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="106" y="582" font-size="12" font-weight="700" fill="#C2410C">Sampling: choose ONE token</text><text x="82" y="604" font-size="9.4" fill="#1F2937">temperature scales the logits  ·  top-p / top-k cut the tail</text><text x="82" y="618" font-size="9.4" fill="#1F2937">repetition penalty  ·  constrained decoding for JSON schemas</text><text x="468" y="580" font-size="9.6" font-weight="700" fill="#C2410C">Stage 6 · your knobs</text><text x="468" y="596" font-size="9" fill="#374151">Temperature 0 ≈ always the top token.</text><text x="468" y="609" font-size="9" fill="#374151">Structured outputs restrict which tokens are allowed.</text><path d="M260.0 644 L260.0 664" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/><rect x="70" y="666" width="380" height="86" rx="8" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.8"/><circle cx="88" cy="686" r="11" fill="#C2410C"/><text x="88" y="690.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="106" y="690" font-size="12" font-weight="700" fill="#C2410C">Append it, run the blocks for that one token: DECODE</text><text x="82" y="712" font-size="9.4" fill="#1F2937">uses the KV cache, so only the new token is computed</text><text x="82" y="726" font-size="9.4" fill="#1F2937">repeat until EOS, max tokens or a stop sequence</text><text x="468" y="688" font-size="9.6" font-weight="700" fill="#C2410C">Memory-bound · decides tokens/s</text><text x="468" y="704" font-size="9" fill="#374151">Reasoning models loop here for their thinking tokens</text><text x="468" y="717" font-size="9" fill="#374151">before the visible answer. Speculative decoding</text><text x="468" y="730" font-size="9" fill="#374151">and batching make this loop faster / cheaper.</text><path d="M260.0 752 L260.0 772" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/><rect x="70" y="774" width="380" height="86" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="1.8"/><circle cx="88" cy="794" r="11" fill="#15803D"/><text x="88" y="798.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">8</text><text x="106" y="798" font-size="12" font-weight="700" fill="#15803D">Detokenize → stream text back to your app</text><text x="82" y="820" font-size="9.4" fill="#1F2937">if the output is a tool call: your code runs it and the result</text><text x="82" y="834" font-size="9.4" fill="#1F2937">goes back into the prompt → step 1 again (the agent loop)</text><text x="468" y="796" font-size="9.6" font-weight="700" fill="#15803D">Stage 7 · output tokens</text><text x="468" y="812" font-size="9" fill="#374151">Billed as output tokens (3–8× the input price).</text><text x="468" y="825" font-size="9" fill="#374151">Streaming sends each token as soon as it exists.</text><path d="M70 709.0 L50 709.0 L50 385.0 L67 385.0" fill="none" stroke="#C2410C" stroke-width="1.6" marker-end="url(#ar)"/><text x="40" y="547.0" font-size="9" font-weight="700" fill="#C2410C" text-anchor="middle" transform="rotate(-90 40 547.0)">decode loop: one token per pass</text><path d="M450 845.0 L458 845.0 L458 861.0 L22 861.0 L22 61.0 L67 61.0" fill="none" stroke="#15803D" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="14" y="439.0" font-size="9" font-weight="700" fill="#15803D" text-anchor="middle" transform="rotate(-90 14 439.0)">agent loop: tool result becomes part of the next prompt</text><rect x="70" y="884" width="380" height="26" rx="4" fill="#F3F4F6" stroke="#D1D5DB"/><text x="80" y="901" font-size="9.2" fill="#111827"><tspan font-weight="700">Time to first token</tspan> = steps 1–6 once.  <tspan font-weight="700">Tokens per second</tspan> = how fast step 7 loops.</text></svg>
