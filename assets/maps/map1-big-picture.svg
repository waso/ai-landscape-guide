<svg viewBox="0 0 760 540" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;font-family:Inter,system-ui,sans-serif"><rect x="6" y="6" width="748" height="528" rx="12" fill="#FFFBEB" stroke="#B45309" stroke-width="1.8"/><text x="18" y="30" font-size="15" font-weight="700" fill="#B45309" text-anchor="start">ARTIFICIAL INTELLIGENCE</text><text x="18" y="56" font-size="10" fill="#374151" text-anchor="start">Outside machine learning:</text><text x="18" y="70" font-size="10" fill="#374151" text-anchor="start">symbolic AI, expert systems,</text><text x="18" y="84" font-size="10" fill="#374151" text-anchor="start">rule engines, search and</text><text x="18" y="98" font-size="10" fill="#374151" text-anchor="start">planning, knowledge graphs,</text><text x="18" y="112" font-size="10" fill="#374151" text-anchor="start">classic robotics control</text><text x="18" y="126" font-size="10" fill="#374151" text-anchor="start"></text><text x="18" y="140" font-size="10" fill="#374151" text-anchor="start">section 1</text><rect x="172" y="44" width="572" height="484" rx="12" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.8"/><text x="184" y="68" font-size="15" font-weight="700" fill="#4B5563" text-anchor="start">MACHINE LEARNING</text><text x="184" y="92" font-size="10" fill="#374151" text-anchor="start">Learn patterns from data.</text><text x="184" y="106" font-size="10" fill="#374151" text-anchor="start"></text><text x="184" y="120" font-size="10" fill="#374151" text-anchor="start">Classic ML (section 3):</text><text x="184" y="134" font-size="10" fill="#374151" text-anchor="start">linear / logistic regression,</text><text x="184" y="148" font-size="10" fill="#374151" text-anchor="start">decision trees, random forest,</text><text x="184" y="162" font-size="10" fill="#374151" text-anchor="start">gradient boosting (XGBoost),</text><text x="184" y="176" font-size="10" fill="#374151" text-anchor="start">SVM, kNN, Naive Bayes,</text><text x="184" y="190" font-size="10" fill="#374151" text-anchor="start">k-means, PCA</text><text x="184" y="204" font-size="10" fill="#374151" text-anchor="start"></text><text x="184" y="218" font-size="10" fill="#374151" text-anchor="start">Paradigms (section 2):</text><text x="184" y="232" font-size="10" fill="#374151" text-anchor="start">supervised, unsupervised,</text><text x="184" y="246" font-size="10" fill="#374151" text-anchor="start">self-supervised,</text><text x="184" y="260" font-size="10" fill="#374151" text-anchor="start">reinforcement learning</text><rect x="330" y="78" width="404" height="440" rx="12" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.8"/><text x="342" y="102" font-size="15" font-weight="700" fill="#0E7490" text-anchor="start">DEEP LEARNING</text><text x="342" y="122" font-size="10" fill="#374151" text-anchor="start">Neural networks with many layers (section 4): MLP, CNN (vision),</text><text x="342" y="136" font-size="10" fill="#374151" text-anchor="start">RNN / LSTM (sequences), autoencoders, GANs, diffusion models.</text><text x="342" y="150" font-size="10" fill="#374151" text-anchor="start">All trained with backprop + gradient descent, on GPUs.</text><rect x="342" y="166" width="244" height="340" rx="12" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.8"/><text x="354" y="190" font-size="15" font-weight="700" fill="#4338CA" text-anchor="start">TRANSFORMERS</text><text x="354" y="212" font-size="10" fill="#374151" text-anchor="start">Attention-based</text><text x="354" y="226" font-size="10" fill="#374151" text-anchor="start">(section 6)</text><text x="354" y="240" font-size="10" fill="#374151" text-anchor="start"></text><text x="354" y="254" font-size="10" fill="#374151" text-anchor="start">Encoder-only: BERT</text><text x="354" y="268" font-size="10" fill="#374151" text-anchor="start">(embeddings,</text><text x="354" y="282" font-size="10" fill="#374151" text-anchor="start">classification)</text><text x="354" y="296" font-size="10" fill="#374151" text-anchor="start">Encoder-decoder:</text><text x="354" y="310" font-size="10" fill="#374151" text-anchor="start">T5, BART (translation,</text><text x="354" y="324" font-size="10" fill="#374151" text-anchor="start">summaries)</text><text x="354" y="338" font-size="10" fill="#374151" text-anchor="start">Vision: ViT</text><text x="354" y="352" font-size="10" fill="#374151" text-anchor="start"></text><text x="354" y="366" font-size="10" fill="#374151" text-anchor="start">Decoder-only: LLMs ▶</text><rect x="488" y="158" width="234" height="348" rx="12" fill="#FDF2F8" stroke="#BE185D" stroke-width="1.8" stroke-dasharray="7 5"/><text x="710" y="182" font-size="15" font-weight="700" fill="#BE185D" text-anchor="end">GENERATIVE AI</text><text x="596" y="204" font-size="10" fill="#374151" text-anchor="start">Produces new content</text><text x="596" y="218" font-size="10" fill="#374151" text-anchor="start">(section 14)</text><text x="596" y="232" font-size="10" fill="#374151" text-anchor="start">Images and video:</text><text x="596" y="246" font-size="10" fill="#374151" text-anchor="start">diffusion models</text><text x="596" y="260" font-size="10" fill="#374151" text-anchor="start">(Stable Diffusion,</text><text x="596" y="274" font-size="10" fill="#374151" text-anchor="start">DALL·E 2/3, Midjourney,</text><text x="596" y="288" font-size="10" fill="#374151" text-anchor="start">Veo), GANs, VAEs</text><text x="596" y="302" font-size="10" fill="#374151" text-anchor="start">Audio: TTS, music</text><text x="596" y="316" font-size="10" fill="#374151" text-anchor="start"></text><text x="596" y="330" font-size="10" fill="#374151" text-anchor="start">Text and code: LLMs ◀</text><rect x="494" y="334" width="86" height="162" rx="9" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.8"/><text x="537" y="356" font-size="15" font-weight="700" fill="#1D4ED8" text-anchor="middle">LLMs</text><text x="537" y="376.0" font-size="9.4" fill="#374151" text-anchor="middle">decoder-only</text><text x="537" y="388.5" font-size="9.4" fill="#374151" text-anchor="middle">Transformers</text><text x="537" y="401.0" font-size="9.4" fill="#374151" text-anchor="middle">trained on text</text><text x="537" y="413.5" font-size="9.4" fill="#374151" text-anchor="middle"></text><text x="537" y="426.0" font-size="9.4" fill="#374151" text-anchor="middle">GPT · Claude</text><text x="537" y="438.5" font-size="9.4" fill="#374151" text-anchor="middle">Gemini · Llama</text><text x="537" y="451.0" font-size="9.4" fill="#374151" text-anchor="middle">Mistral · Qwen</text><text x="537" y="463.5" font-size="9.4" fill="#374151" text-anchor="middle">DeepSeek</text><text x="537" y="489" font-size="9" font-weight="600" fill="#1D4ED8" text-anchor="middle">sections 5–11</text></svg>
