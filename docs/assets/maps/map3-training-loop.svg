<svg viewBox="0 0 400 340" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;font-family:Inter,system-ui,sans-serif"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#374151"/></marker></defs><rect x="8" y="14" width="182" height="86" rx="8" fill="#fff" stroke="#0E7490" stroke-width="1.8"/><circle cx="24" cy="32" r="10" fill="#0E7490"/><text x="24" y="36" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="40" y="36" font-size="12.5" font-weight="700" fill="#0E7490">Forward pass</text><text x="18" y="54.0" font-size="9.6" fill="#374151">input tokens → embeddings →</text><text x="18" y="66.5" font-size="9.6" fill="#374151">layers → logits → softmax</text><text x="18" y="79.0" font-size="9.6" fill="#374151">= predicted probabilities</text><rect x="210" y="14" width="182" height="86" rx="8" fill="#fff" stroke="#0E7490" stroke-width="1.8"/><circle cx="226" cy="32" r="10" fill="#0E7490"/><text x="226" y="36" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="242" y="36" font-size="12.5" font-weight="700" fill="#0E7490">Loss</text><text x="220" y="54.0" font-size="9.6" fill="#374151">compare prediction with the</text><text x="220" y="66.5" font-size="9.6" fill="#374151">target (cross-entropy for</text><text x="220" y="79.0" font-size="9.6" fill="#374151">next-token prediction)</text><rect x="210" y="226" width="182" height="86" rx="8" fill="#fff" stroke="#0E7490" stroke-width="1.8"/><circle cx="226" cy="244" r="10" fill="#0E7490"/><text x="226" y="248" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="242" y="248" font-size="12.5" font-weight="700" fill="#0E7490">Backward pass</text><text x="220" y="266.0" font-size="9.6" fill="#374151">backpropagation applies the</text><text x="220" y="278.5" font-size="9.6" fill="#374151">chain rule to get a gradient</text><text x="220" y="291.0" font-size="9.6" fill="#374151">for every weight</text><rect x="8" y="226" width="182" height="86" rx="8" fill="#fff" stroke="#0E7490" stroke-width="1.8"/><circle cx="24" cy="244" r="10" fill="#0E7490"/><text x="24" y="248" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="40" y="248" font-size="12.5" font-weight="700" fill="#0E7490">Optimizer step</text><text x="18" y="266.0" font-size="9.6" fill="#374151">weight −= learning rate × gradient</text><text x="18" y="278.5" font-size="9.6" fill="#374151">(SGD; AdamW adapts the step</text><text x="18" y="291.0" font-size="9.6" fill="#374151">per weight, adds weight decay)</text><path d="M190 57 L208 57" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><path d="M301 100 L301 224" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><path d="M210 269 L192 269" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><path d="M99 226 L99 102" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/><text x="200" y="152" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">repeat per mini-batch</text><text x="200" y="167" font-size="9.4" fill="#6B7280" text-anchor="middle">one pass over all data = 1 epoch</text><text x="200" y="180" font-size="9.4" fill="#6B7280" text-anchor="middle">millions of steps for an LLM</text><text x="200" y="332" font-size="9.4" fill="#6B7280" text-anchor="middle">Inference = step 1 only, with the weights frozen.</text></svg>
