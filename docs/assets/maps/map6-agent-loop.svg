<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;font-family:Inter,system-ui,sans-serif"><defs><marker id="aa" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#374151"/></marker></defs><rect x="150" y="8" width="420" height="214" rx="10" fill="#F0FDF4" stroke="#15803D" stroke-width="1.4" stroke-dasharray="6 4"/><text x="160" y="24" font-size="9.5" font-weight="700" fill="#15803D">AGENT RUNTIME  (your code: a loop)</text><rect x="8" y="60" width="120" height="58" rx="6" fill="#F3F4F6" stroke="#374151" stroke-width="1.6"/><text x="68.0" y="77" font-size="10" font-weight="700" fill="#374151" text-anchor="middle">User goal</text><text x="68.0" y="91" font-size="8.2" fill="#374151" text-anchor="middle">&quot;Fix the failing</text><text x="68.0" y="102" font-size="8.2" fill="#374151" text-anchor="middle">test in PR 42&quot;</text><rect x="170" y="44" width="180" height="80" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="1.6"/><text x="260.0" y="61" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">Context</text><text x="260.0" y="75" font-size="8.2" fill="#374151" text-anchor="middle">system prompt + tool definitions</text><text x="260.0" y="86" font-size="8.2" fill="#374151" text-anchor="middle">+ history + tool results so far</text><text x="260.0" y="97" font-size="8.2" fill="#374151" text-anchor="middle">(context engineering)</text><rect x="380" y="44" width="170" height="80" rx="6" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.6"/><text x="465.0" y="61" font-size="10" font-weight="700" fill="#C2410C" text-anchor="middle">LLM call</text><text x="465.0" y="75" font-size="8.2" fill="#374151" text-anchor="middle">decides: final answer</text><text x="465.0" y="86" font-size="8.2" fill="#374151" text-anchor="middle">OR a tool call</text><text x="465.0" y="97" font-size="8.2" fill="#374151" text-anchor="middle">{name, arguments}</text><rect x="170" y="140" width="180" height="66" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="1.6"/><text x="260.0" y="157" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">Tool result</text><text x="260.0" y="171" font-size="8.2" fill="#374151" text-anchor="middle">appended to the context</text><text x="260.0" y="182" font-size="8.2" fill="#374151" text-anchor="middle">(treat as untrusted data:</text><text x="260.0" y="193" font-size="8.2" fill="#374151" text-anchor="middle">prompt injection lives here)</text><rect x="380" y="140" width="170" height="66" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="1.6"/><text x="465.0" y="157" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">Execute the tool</text><text x="465.0" y="171" font-size="8.2" fill="#374151" text-anchor="middle">your code, in a sandbox,</text><text x="465.0" y="182" font-size="8.2" fill="#374151" text-anchor="middle">with permissions; risky</text><text x="465.0" y="193" font-size="8.2" fill="#374151" text-anchor="middle">steps ask a human (HITL)</text><rect x="600" y="40" width="150" height="56" rx="6" fill="#F3F4F6" stroke="#374151" stroke-width="1.6"/><text x="675.0" y="57" font-size="10" font-weight="700" fill="#374151" text-anchor="middle">Final answer</text><text x="675.0" y="71" font-size="8.2" fill="#374151" text-anchor="middle">or a completed action;</text><text x="675.0" y="82" font-size="8.2" fill="#374151" text-anchor="middle">stop condition reached</text><rect x="600" y="122" width="150" height="84" rx="6" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.6"/><text x="675.0" y="139" font-size="10" font-weight="700" fill="#4338CA" text-anchor="middle">MCP servers</text><text x="675.0" y="153" font-size="8.2" fill="#374151" text-anchor="middle">database · API · files</text><text x="675.0" y="164" font-size="8.2" fill="#374151" text-anchor="middle">browser · search · your</text><text x="675.0" y="175" font-size="8.2" fill="#374151" text-anchor="middle">Spring AI services</text><path d="M128 89 L168 89" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#aa)"/><path d="M350 84 L378 84" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#aa)"/><path d="M465 124 L465 138" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#aa)"/><text x="500" y="134" font-size="8" fill="#374151" text-anchor="middle">tool call</text><path d="M550 173 L598 173" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#aa)"/><text x="575" y="166" font-size="8" fill="#374151" text-anchor="middle">MCP: call → result</text><path d="M378 173 L352 173" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#aa)"/><path d="M260 140 L260 126" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#aa)"/><text x="285" y="136" font-size="8" fill="#374151" text-anchor="middle">loop</text><path d="M465 44 L465 30 L675 30 L675 38" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#aa)"/><text x="560" y="26" font-size="8" fill="#374151" text-anchor="middle">done → answer</text><rect x="8" y="150" width="120" height="56" rx="6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.6" stroke-dasharray="6 4"/><text x="68.0" y="167" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">Guardrails</text><text x="68.0" y="181" font-size="8.2" fill="#374151" text-anchor="middle">input / output checks,</text><text x="68.0" y="192" font-size="8.2" fill="#374151" text-anchor="middle">schemas, classifiers</text><rect x="8" y="236" width="170" height="50" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="1.6" stroke-dasharray="6 4"/><text x="93.0" y="253" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">Memory</text><text x="93.0" y="267" font-size="8.2" fill="#374151" text-anchor="middle">facts stored outside the context,</text><text x="93.0" y="278" font-size="8.2" fill="#374151" text-anchor="middle">retrieved when relevant</text><rect x="195" y="236" width="200" height="50" rx="6" fill="#E2E8F0" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4"/><text x="295.0" y="253" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">Observability / tracing</text><text x="295.0" y="267" font-size="8.2" fill="#374151" text-anchor="middle">every prompt, tool call, token</text><text x="295.0" y="278" font-size="8.2" fill="#374151" text-anchor="middle">and cost, per request</text><rect x="412" y="236" width="338" height="50" rx="6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.6" stroke-dasharray="6 4"/><text x="581.0" y="253" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">Evals</text><text x="581.0" y="267" font-size="8.2" fill="#374151" text-anchor="middle">did the agent finish the task? LLM-as-judge + test cases,</text><text x="581.0" y="278" font-size="8.2" fill="#374151" text-anchor="middle">run on every prompt or model change</text><text x="8" y="312" font-size="8.6" fill="#374151"><tspan font-weight="700">The model answers once; the loop is yours.</tspan> MCP standardises the arrow between the loop and the tools: one server, every client. A2A standardises agents calling other agents.</text></svg>
