<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;font-family:Inter,system-ui,sans-serif"><defs><marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#374151"/></marker></defs><text x="8" y="16" font-size="9.5" font-weight="700" fill="#6B7280">INGEST  (offline, once per document)</text><rect x="8" y="26" width="150" height="58" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="1.6"/><text x="83.0" y="43" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">Documents</text><text x="83.0" y="57" font-size="8.2" fill="#374151" text-anchor="middle">PDFs, wiki, tickets, code</text><text x="83.0" y="68" font-size="8.2" fill="#374151" text-anchor="middle">(OCR for scans)</text><path d="M158 55.0 L176 55.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ag)"/><rect x="178" y="26" width="150" height="58" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="1.6"/><text x="253.0" y="43" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">Chunking</text><text x="253.0" y="57" font-size="8.2" fill="#374151" text-anchor="middle">split into 200–1000-token</text><text x="253.0" y="68" font-size="8.2" fill="#374151" text-anchor="middle">pieces, with overlap</text><path d="M328 55.0 L346 55.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ag)"/><rect x="348" y="26" width="150" height="58" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="1.6"/><text x="423.0" y="43" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">Embedding model</text><text x="423.0" y="57" font-size="8.2" fill="#374151" text-anchor="middle">each chunk → vector</text><text x="423.0" y="68" font-size="8.2" fill="#374151" text-anchor="middle">(a separate small model)</text><path d="M498 55.0 L516 55.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ag)"/><rect x="518" y="26" width="150" height="58" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="1.6"/><text x="593.0" y="43" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">Vector DB</text><text x="593.0" y="57" font-size="8.2" fill="#374151" text-anchor="middle">store vector + text + metadata</text><text x="593.0" y="68" font-size="8.2" fill="#374151" text-anchor="middle">pgvector, Qdrant, Pinecone</text><text x="8" y="124" font-size="9.5" font-weight="700" fill="#6B7280">QUERY  (online, per request)</text><rect x="8" y="134" width="112" height="58" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="1.6"/><text x="64.0" y="151" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">Question</text><text x="64.0" y="165" font-size="8.2" fill="#374151" text-anchor="middle">from the user</text><text x="64.0" y="176" font-size="8.2" fill="#374151" text-anchor="middle">or the agent</text><path d="M120 163.0 L132 163.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ag)"/><rect x="134" y="134" width="112" height="58" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="1.6"/><text x="190.0" y="151" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">Embed it</text><text x="190.0" y="165" font-size="8.2" fill="#374151" text-anchor="middle">same embedding</text><text x="190.0" y="176" font-size="8.2" fill="#374151" text-anchor="middle">model</text><path d="M246 163.0 L258 163.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ag)"/><rect x="260" y="134" width="112" height="58" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="1.6"/><text x="316.0" y="151" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">Search</text><text x="316.0" y="165" font-size="8.2" fill="#374151" text-anchor="middle">nearest vectors +</text><text x="316.0" y="176" font-size="8.2" fill="#374151" text-anchor="middle">keyword (hybrid)</text><path d="M372 163.0 L384 163.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ag)"/><rect x="386" y="134" width="112" height="58" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="1.6"/><text x="442.0" y="151" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">Rerank</text><text x="442.0" y="165" font-size="8.2" fill="#374151" text-anchor="middle">keep the best</text><text x="442.0" y="176" font-size="8.2" fill="#374151" text-anchor="middle">3–10 chunks</text><path d="M498 163.0 L510 163.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ag)"/><rect x="512" y="134" width="112" height="58" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="1.6"/><text x="568.0" y="151" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">Build prompt</text><text x="568.0" y="165" font-size="8.2" fill="#374151" text-anchor="middle">system + chunks +</text><text x="568.0" y="176" font-size="8.2" fill="#374151" text-anchor="middle">question</text><path d="M624 163.0 L636 163.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ag)"/><rect x="638" y="134" width="112" height="58" rx="6" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.6"/><text x="694.0" y="151" font-size="10" font-weight="700" fill="#C2410C" text-anchor="middle">LLM</text><text x="694.0" y="165" font-size="8.2" fill="#374151" text-anchor="middle">answers from the</text><text x="694.0" y="176" font-size="8.2" fill="#374151" text-anchor="middle">chunks, with citations</text><path d="M593.0 84 L593.0 106 L316.0 106 L316.0 132" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ag)"/><text x="454.5" y="102" font-size="8" fill="#6B7280" text-anchor="middle">top-k similar chunks</text><text x="8" y="222" font-size="8.6" fill="#374151"><tspan font-weight="700">What RAG buys you:</tspan> knowledge the model never saw, kept current by re-indexing, with sources, and no training. </text><text x="8" y="237" font-size="8.6" fill="#374151"><tspan font-weight="700">What usually goes wrong:</tspan> retrieval, not generation. Tune chunking, use hybrid search and a reranker, and evaluate “did the right chunk come back?” separately from the answer.</text><text x="8" y="252" font-size="8.6" fill="#374151"><tspan font-weight="700">Weights never change.</tspan> The embedding model and the LLM are both frozen; all the work is in the pipeline around them.</text><text x="8" y="272" font-size="8.6" fill="#374151"><tspan font-weight="700">Agentic RAG:</tspan> instead of one fixed retrieve-then-answer pass, the agent below calls “search” as a tool, as many times as it needs, and decides when it has enough.</text></svg>
